link_mode: ""
mappings:
- match: AGENTS.md
  link_as_dir: false
  skip: true
  dest: ""
  target_os: ""
- match: .config/nvim/snippets
  link_as_dir: true
  skip: false
  dest: ""
  target_os: ""
- match: .*gpg-agent.conf.darwin
  link_as_dir: false
  skip: false
  dest: ~/.gnupg/gpg-agent.conf
  target_os: Darwin
- match: .config/ghostty/macos-config
  link_as_dir: false
  skip: true
  dest: ""
  target_os: Linux
- match: .gemini/policies/.*
  link_as_dir: true
  skip: false
  dest: ""
  target_os: ""
- match: .agents/$
  link_as_dir: true
  skip: false
  dest: ""
  target_os: ""
- match: .config/opencode/agents/$
  link_as_dir: true
  skip: false
  dest: ""
  target_os: ""
- match: .pi/agent/.*
  link_as_dir: true
  skip: false
  dest: ""
  target_os: ""
- match: "(^|/)\\.pi/agent($|/.*)"
  link_as_dir: true
  skip: false
  dest: ""
  target_os: ""
modules:
- link_mode: ""
  mappings: []
  modules: []
  prompt_for_commit_message: false
  pull_only: false
  repository: git@github.com:chasinglogic/secrets.git
  root_dir: ""
  hooks: {}
  llm:
    model_provider: ""
    model: ""
    commit_messages: false
    commit_message_prompt: ""
