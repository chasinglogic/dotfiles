# Match the fallback fish prompt when Starship is installed.
format = "$directory$git_branch$kubernetes\n$status$username$hostname$git_status${custom.suffix}"
add_newline = false

[directory]
format = "[$path](green) "
truncation_length = 0
fish_style_pwd_dir_length = 1

[git_branch]
format = "[vcs=](#8BE9FD)[$branch](#F8F8F2) "

[kubernetes]
disabled = false
style = "#F8F8F2"
format = "[kube=](#8BE9FD)[$context]($style) "

[[kubernetes.contexts]]
context_pattern = "production"
style = "#FF5555"

[status]
disabled = false
pipestatus = true
format = "[\\[$status\\]](bold #FF5555) "
pipestatus_format = "[\\[$pipestatus\\]](bold #FF5555) "
pipestatus_segment_format = "$status"

[username]
format = "[$user](#BD93F9)"

[hostname]
ssh_only = false
trim_at = ".local"
format = "[@$hostname](#BD93F9) "

[custom.suffix]
when = "true"
format = "[λ](#FFB86C) "

[git_status]
style = 'bold white'
