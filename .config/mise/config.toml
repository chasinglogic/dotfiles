[tools]
# Existing personal tools.
"github:asdine/cueimports" = "latest"

# Everyday shell and terminal workflow.
bat = "latest"
delta = "latest"
fd = "latest"
fzf = "latest"
jq = "latest"
ripgrep = "latest"
yq = "latest"
"github:starship/starship" = "latest"
hwatch = "latest"
neovim = "latest"

# Build, automation, and repository maintenance.
act = "latest"
gh = "latest"
just = "latest"
usage = "latest"

# Programming languages and runtimes.
deno = "latest"
go = "latest"
node = "latest"
rust = "latest"
uv = "latest"
python = "latest"

# Language tooling, formatters, and linters.
biome = "latest"
"npm:eslint" = "latest"
golangci-lint = "latest"
# Avoid current registry "latest" resolving to nightly builds.
goreleaser = "2.20.1"
ruff = "latest"
shellcheck = "latest"
shfmt = "latest"
tree-sitter = "latest"
"pipx:python-lsp-server[all]" = "latest"

# Cloud, infrastructure-as-code, and secret management.
age = "latest"
aws = "latest"
opentofu = "latest"
pulumi = "latest"
sops = "latest"
terraform = "latest"
terragrunt = "latest"
tflint = "latest"

# Kubernetes and cluster operations.
k9s = "latest"
kind = "latest"
kube-capacity = "latest"
kubebuilder = "latest"
kubectl = "latest"
helm = "latest"
krew = "latest"

# Container workflows and supply-chain/security scanning.
cosign = "latest"
docker-compose = "latest"
grype = "latest"
syft = "latest"

# API and performance diagnostics.
gdu = "latest"
grpcurl = "latest"
hyperfine = "latest"
oha = "latest"

# Personal workflows.
hugo = "latest"
"github:chasinglogic/dfm" = "latest"
"github:chasinglogic/projector" = "latest"
github-cli = "latest"
git-filter-repo = "latest"
"github:nklmilojevic/sofka" = "latest"
"github:earendil-works/pi" = "latest"
"github:gruntwork-io/boilerplate" = "latest"
"github:pre-commit/pre-commit" = "latest"

[settings]
experimental = true
idiomatic_version_file_enable_tools = ["python"]
lockfile = true

minimum_release_age_excludes = [
    "codex", 
    "oha", 
    "github:earendil-works/pi", 
    "github:chasinglogic/dfm",
    "gemini",
    "hugo",
]
